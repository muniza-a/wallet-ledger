; Loaded after the image's zz-docker.conf, so these values win.
[global]
; On SIGQUIT, give workers up to 20s to finish in-flight requests.
process_control_timeout = 20s

[www]
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 4096

; Fixed pool: no fork cost under load. Enough workers that a hot user
; waiting on its row lock does not starve requests for other users.
pm = static
pm.max_children = ${FPM_WORKERS}
pm.max_requests = 0

access.log = /dev/null
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
