user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    server_tokens off;
    keepalive_timeout 65;
    keepalive_requests 10000;
    client_max_body_size 64k;

    # No FastCGI keepalive: an idle kept-alive connection pins a PHP-FPM worker.
    # With several Nginx workers each caching connections, all FPM workers end up
    # pinned to idle connections and new requests wait in the socket backlog until
    # they time out. A fresh connect over a Unix socket costs microseconds.
    upstream php {
        server unix:/run/php-fpm.sock;
    }

    server {
        listen 8080 backlog=4096;
        root /var/www/html/public;

        # Every request goes straight to Laravel's front controller: no static files, no try_files stat.
        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass php;
        }

        # Bodies over client_max_body_size are rejected here, before PHP runs.
        # Answer in the API's JSON error shape instead of Nginx's HTML page.
        error_page 413 @payload_too_large;
        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":"payload_too_large","message":"Request body must be at most 64 KB."}';
        }
    }
}
